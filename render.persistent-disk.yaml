# Render Deployment Blueprint for PennyPilot (Paid Option: Render Starter + Persistent Disk)
# Preserved for reference and seamless transition to permanent paid cloud storage if needed.
services:
  - type: web
    name: pennypilot-backend
    env: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1
    disk:
      name: pennypilot-sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: DATABASE_URL
        value: sqlite:////var/data/penny_pilot.db
      - key: AVATAR_UPLOAD_DIR
        value: /var/data/avatars
      - key: RECEIPT_UPLOAD_DIR
        value: /var/data/receipts
      - key: FRONTEND_URL
        value: https://pennypilot.vercel.app
      - key: FRONTEND_BASE_URL
        value: https://pennypilot.vercel.app
      - key: BACKEND_BASE_URL
        value: https://pennypilot-backend.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://pennypilot.vercel.app,http://localhost:5173
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAMESITE
        value: none
      - key: GEMINI_API_KEY
        sync: false # Free Google AI Studio API key
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false # Brevo SMTP login
      - key: SMTP_PASSWORD
        sync: false # Brevo SMTP master key
      - key: SMTP_FROM_EMAIL
        sync: false # Verified Brevo sender email
      - key: SMTP_FROM_NAME
        value: PennyPilot
      - key: SMTP_USE_TLS
        value: true
      - key: GOOGLE_CLIENT_ID
        sync: false # Google Cloud OAuth Client ID
      - key: GOOGLE_CLIENT_SECRET
        sync: false # Google Cloud OAuth Client Secret
      - key: GOOGLE_REDIRECT_URI
        value: https://pennypilot-backend.onrender.com/api/v1/auth/google/callback
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: DEFAULT_CURRENCY
        value: INR
